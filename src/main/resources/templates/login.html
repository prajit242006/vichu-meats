<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Vichu Meats')}"></head><body><header th:replace="~{fragments :: header}"></header><main id="main"><section class="wrap section narrow"><span class="eyebrow">VICHU MEATS</span><h1>Owner sign in</h1><p class="notice error" th:if="${param.error}">Sign in failed. Check your credentials.</p><p class="notice" th:if="${param.logout}">You have signed out.</p><form class="panel form-grid" th:action="@{/login}" method="post"><label>Username<input name="username" required autocomplete="username"></label><label>Password<input name="password" type="password" required autocomplete="current-password"></label><button>Sign in</button></form><p>First time? Follow the admin setup instructions in README.md. There is no public registration.</p></section></main><footer th:replace="~{fragments :: footer}"></footer><script src="/js/site.js" defer></script></body></html>
