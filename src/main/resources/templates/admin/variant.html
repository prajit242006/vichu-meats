<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Owner · Vichu Meats')}"></head><body><header th:replace="~{fragments :: header}"></header><main id="main"><section class="wrap section"><div th:replace="~{fragments :: adminnav}"></div><h1>Edit product option</h1><form class="panel form-grid narrow" th:action="@{/admin/variants/save}" th:object="${form}" method="post"><div th:replace="~{fragments :: errors}"></div><input type="hidden" th:field="*{id}"><input type="hidden" th:field="*{productId}"><label>Option label<input th:field="*{label}" required placeholder="200 ml / 1 kg / 6 eggs"></label><label>Unit<input th:field="*{unit}" required placeholder="bottle / kg / pack"></label><label>Price in INR (blank means Contact for price)<input type="number" th:field="*{price}" min="0.01" step="0.01"></label><label class="check"><input type="checkbox" th:field="*{available}"> Available</label><label class="check"><input type="checkbox" th:field="*{depositEnabled}"> Enable container deposit for this option</label><label>Deposit per item in INR<input type="number" th:field="*{deposit}" min="0" step="0.01" required></label><p>Quantity counts this option. For fractional weights, create a 500 g or other sized option with its own price.</p><button>Save option</button></form></section></main><footer th:replace="~{fragments :: footer}"></footer><script src="/js/site.js" defer></script></body></html>
