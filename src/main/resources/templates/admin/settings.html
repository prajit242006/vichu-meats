<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Owner · Vichu Meats')}"></head><body><header th:replace="~{fragments :: header}"></header><main id="main"><section class="wrap section"><div th:replace="~{fragments :: adminnav}"></div><h1>Business settings</h1><form class="panel form-grid narrow" th:action="@{/admin/settings}" th:object="${form}" method="post" enctype="multipart/form-data"><div th:replace="~{fragments :: errors}"></div><label>Phone (blank to hide)<input th:field="*{phone}"></label><label>WhatsApp (country code + number, digits only, blank to hide)<input th:field="*{whatsapp}"></label><label>Business hours (blank to hide)<input th:field="*{hours}" maxlength="200"></label><label>Instagram profile URL (https://instagram.com/...)<input th:field="*{instagram}"></label><label>Facebook profile URL (https://facebook.com/...)<input th:field="*{facebook}"></label><label>Farm story<textarea th:field="*{story}" required maxlength="3500"></textarea></label><label>Farm photo (JPG/PNG)<input type="file" name="image" accept="image/png,image/jpeg"></label><label>Sheep pricing basis (only owner-confirmed basis)<input th:field="*{sheepBasis}" required maxlength="120"></label><label class="check"><input type="checkbox" th:field="*{deliveryEnabled}"> Enable delivery to active areas below</label><label class="check"><input type="checkbox" th:field="*{cashEnabled}"> Offer cash payment preference</label><label class="check"><input type="checkbox" th:field="*{upiEnabled}"> Offer UPI on confirmation</label><button>Save settings</button></form><h2>Supported delivery areas</h2><form class="panel form-grid narrow" th:each="a : ${areas}" th:action="@{/admin/areas}" method="post"><input type="hidden" name="id" th:value="${a.id}"><label>Area name<input name="name" th:value="${a.name}" required maxlength="120"></label><label>Fee INR<input name="fee" type="number" th:value="${a.fee}" min="0" step="0.01" required></label><label class="check"><input name="active" type="checkbox" value="true" th:checked="${a.active}"> Enabled</label><button>Update area</button></form><form class="panel form-grid narrow" th:action="@{/admin/areas}" method="post"><h3>Add area</h3><label>Name<input name="name" required maxlength="120"></label><label>Fee INR<input name="fee" type="number" min="0" step="0.01" required></label><label class="check"><input type="checkbox" name="active" value="true" checked> Enabled</label><button>Add area</button></form></section></main><footer th:replace="~{fragments :: footer}"></footer><script src="/js/site.js" defer></script></body></html>
