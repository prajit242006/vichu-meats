<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Owner · Vichu Meats')}"></head><body><header th:replace="~{fragments :: header}"></header><main id="main"><section class="wrap section"><div th:replace="~{fragments :: adminnav}"></div><h1>Edit product</h1><form class="panel form-grid narrow" th:action="@{/admin/products/save}" th:object="${form}" method="post" enctype="multipart/form-data"><div th:replace="~{fragments :: errors}"></div><input type="hidden" th:field="*{id}"><label>Product name<input th:field="*{name}" required maxlength="100"></label><label>Category<select th:field="*{category}"><option value="Chicken">Chicken</option><option value="Milk">Milk</option><option value="Eggs">Eggs</option></select></label><label>Description<textarea th:field="*{description}" maxlength="1500" required></textarea></label><label>Replace image (JPG/PNG, under 3 MB, at most 4000 × 4000)<input type="file" name="image" accept="image/png,image/jpeg"></label><label class="check"><input type="checkbox" th:field="*{active}"> Visible in shop</label><label class="check"><input type="checkbox" th:field="*{demo}"> Preview catalogue label (clear only after owner review)</label><button>Save product</button></form></section></main><footer th:replace="~{fragments :: footer}"></footer><script src="/js/site.js" defer></script></body></html>
