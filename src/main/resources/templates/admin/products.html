<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Owner · Vichu Meats')}"></head><body><header th:replace="~{fragments :: header}"></header><main id="main"><section class="wrap section"><div th:replace="~{fragments :: adminnav}"></div><div class="section-heading"><h1>Products &amp; options</h1><a class="button" href="/admin/products/edit">Add product</a></div><article class="panel" th:each="p : ${products}"><h2 th:text="${p.name}"></h2><p th:text="${p.category}+' · '+(${p.active}?'Active':'Hidden')+' · '+(${p.demo}?'Preview':'Owner reviewed')"></p><a th:href="@{/admin/products/edit(id=${p.id})}">Edit product &amp; image</a><div class="table-scroll"><table><thead><tr><th>Option</th><th>Unit</th><th>Price</th><th>Available</th><th>Action</th></tr></thead><tbody><tr th:each="v : ${p.variants}"><td th:text="${v.label}"></td><td th:text="${v.unit}"></td><td th:text="${v.price ?: 'Not set'}"></td><td th:text="${v.available}"></td><td><a th:href="@{/admin/variants/edit(productId=${p.id},id=${v.id})}">Edit</a></td></tr></tbody></table></div><a th:href="@{/admin/variants/edit(productId=${p.id})}">Add option →</a></article></section></main><footer th:replace="~{fragments :: footer}"></footer><script src="/js/site.js" defer></script></body></html>
