<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Owner · Vichu Meats')}"></head><body><header th:replace="~{fragments :: header}"></header><main id="main"><section class="wrap section"><div th:replace="~{fragments :: adminnav}"></div><h1>Whole-sheep enquiries</h1><article class="panel" th:each="e : ${enquiries}"><h2 th:text="${e.reference}"></h2><p th:text="${e.customerName}+' · '+${e.phone}"></p><p th:text="${e.preferredDate}+' · '+${e.festival}+' · '+${e.sheepCount}+' sheep'"></p><p th:text="'Preferred weight: '+${e.weightRange}"></p><p class="preserve" th:text="${e.notes}"></p><form class="form-grid" th:action="@{/admin/sheep/{id}(id=${e.id})}" method="post"><label>Status<select name="status"><option th:each="s : ${ {'Requested','Contacted','Quoted','Closed','Cancelled'} }" th:value="${s}" th:selected="${s==e.status}" th:text="${s}"></option></select></label><label>Estimated price (INR, optional)<input name="estimatedPrice" type="number" min="0" step="0.01" th:value="${e.estimatedPrice}"></label><label>Pricing basis<input name="pricingBasis" th:value="${e.pricingBasis}" required maxlength="120"></label><label>Owner notes<textarea name="ownerNotes" th:text="${e.ownerNotes}" maxlength="1500"></textarea></label><p>Estimated price only. Confirm weight, availability and quoted rate directly with the customer. This update does not send a message.</p><button>Save enquiry</button></form></article></section></main><footer th:replace="~{fragments :: footer}"></footer><script src="/js/site.js" defer></script></body></html>
