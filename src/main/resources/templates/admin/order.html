<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Owner · Vichu Meats')}"></head><body><header th:replace="~{fragments :: header}"></header><main id="main"><section class="wrap section"><div th:replace="~{fragments :: adminnav}"></div><div class="section-heading"><h1 th:text="${order.reference}"></h1><button id="print-button">Print summary</button></div><div class="panel"><p th:text="'Status: '+${order.status}"></p><p th:if="${order.demo}">PREVIEW ORDER</p><h2 th:text="${order.customerName}"></h2><p th:text="${order.phone}"></p><p th:text="${order.fulfilment}+' · '+${order.requestedDate}"></p><p th:if="${order.address}" th:text="${order.address}+' · '+${order.deliveryArea}"></p><p th:text="'Payment preference: '+${order.payment}+' (payment not tracked)'"></p><p class="preserve" th:text="${order.notes}"></p><table><thead><tr><th>Product / option / unit</th><th>Quantity</th><th>Unit price</th><th>Deposit each</th><th>Total</th></tr></thead><tbody><tr th:each="i : ${order.items}"><td th:text="${i.productName}+' / '+${i.variantLabel}+' / '+${i.unit}"></td><td th:text="${i.quantity}"></td><td th:text="'₹'+${i.unitPrice}"></td><td th:text="'₹'+${i.deposit}"></td><td th:text="'₹'+${i.lineTotal}"></td></tr></tbody></table><p th:text="'Delivery fee ₹'+${order.deliveryFee}"></p><h2 th:text="'Requested total ₹'+${order.total}"></h2><p>Order request received. Vichu Meats will confirm availability and fulfilment.</p></div><form class="actions no-print" th:action="@{/admin/orders/{id}/status(id=${order.id})}" method="post"><label>Status<select name="status"><option th:each="s : ${statuses}" th:value="${s}" th:text="${s}" th:selected="${s==order.status}"></option></select></label><button>Update status</button></form></section></main><footer th:replace="~{fragments :: footer}"></footer><script src="/js/site.js" defer></script></body></html>
