<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Vichu Meats')}"></head><body><header th:replace="~{fragments :: header}"></header><main id="main"><section class="wrap section narrow"><span class="eyebrow">ONE MORE STEP</span><h1>Request your order</h1><p>No payment is collected here. The owner will confirm availability and fulfilment.</p><form class="panel form-grid" th:action="@{/checkout}" th:object="${form}" method="post"><div th:replace="~{fragments :: errors}"></div><input type="hidden" th:field="*{token}"><label>Your name<input th:field="*{customerName}" required maxlength="100" autocomplete="name"></label><label>Phone number<input th:field="*{phone}" required maxlength="20" autocomplete="tel" type="tel"></label><label>Fulfilment<select th:field="*{fulfilment}" id="fulfilment"><option value="Pickup">Pickup</option><option th:if="${business.deliveryEnabled and !#lists.isEmpty(areas)}" value="Delivery">Delivery</option></select></label><div id="delivery-fields"><label>Supported delivery area<select th:field="*{areaId}" id="area"><option value="">Choose an area</option><option th:each="a : ${areas}" th:value="${a.id}" th:attr="data-fee=${a.fee}" th:text="${a.name}+' · ₹'+${a.fee}"></option></select></label><label>Delivery address<textarea th:field="*{address}" maxlength="500" autocomplete="street-address"></textarea></label></div><label>Requested date<input type="date" th:field="*{requestedDate}" required></label><label>Payment preference<select th:field="*{payment}"><option value="Not selected">Arrange with owner</option><option th:if="${business.cashEnabled}" value="Cash">Cash</option><option th:if="${business.upiEnabled}" value="UPI on confirmation">UPI on confirmation</option></select></label><label>Notes (optional)<textarea th:field="*{notes}" maxlength="1500"></textarea></label><div class="summary"><p th:each="l : ${lines}" th:text="${l.name}+' · '+${l.label}+' × '+${l.quantity}+' — ₹'+${l.total}"></p><strong id="checkout-total" th:attr="data-subtotal=${subtotal}" th:text="'Requested total ₹'+${subtotal}"></strong><small>Includes configured container deposits. Delivery fees are added for the selected area.</small></div><p>By submitting, you acknowledge the <a href="/privacy">privacy notice</a>.</p><button class="button" data-submit>Submit order request →</button></form></section></main><footer th:replace="~{fragments :: footer}"></footer><script src="/js/site.js" defer></script></body></html>
