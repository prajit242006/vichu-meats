<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Vichu Meats')}"></head><body><header th:replace="~{fragments :: header}"></header><main id="main"><section class="wrap section narrow"><h1>Your farm basket</h1><p th:if="${message}" class="notice" th:text="${message}"></p><div th:if="${cartError}"><p class="notice error" th:text="${cartError}"></p><form th:each="entry : ${rawCart}" th:action="@{/cart/update}" method="post"><input type="hidden" name="variantId" th:value="${entry.key}"><input type="hidden" name="quantity" value="0"><button th:text="'Remove option #'+${entry.key}"></button></form></div><div th:unless="${cartError}"><article class="cart-row" th:each="l : ${lines}"><div><h3 th:text="${l.name}"></h3><p th:text="${l.label}+' · ₹'+${l.price}+' / '+${l.unit}"></p><small th:if="${l.deposit.signum()>0}" th:text="'Container deposit: ₹'+${l.deposit}+' per item'"></small></div><form th:action="@{/cart/update}" method="post"><input type="hidden" name="variantId" th:value="${l.variantId}"><label>Quantity <input type="number" name="quantity" th:value="${l.quantity}" min="0" max="100"></label><button>Update</button><small>Set 0 to remove</small></form><strong th:text="'₹'+${l.total}"></strong></article><div class="panel" th:if="${!#lists.isEmpty(lines)}"><h2 th:text="'Subtotal ₹'+${subtotal}"></h2><p>Delivery fees, if enabled, appear at checkout. Final fulfilment requires owner confirmation.</p><a class="button" href="/checkout">Request this order →</a></div><p th:if="${#lists.isEmpty(lines)}">Your basket is waiting. <a href="/shop">Explore the collection →</a></p></div></section></main><footer th:replace="~{fragments :: footer}"></footer><script src="/js/site.js" defer></script></body></html>
