spring.application.name=vichu-meats
server.address=${BIND_ADDRESS:127.0.0.1}
server.port=8080
spring.datasource.url=jdbc:h2:file:${DATA_DIR:./data}/vichu;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=false
spring.servlet.multipart.max-file-size=3MB
spring.servlet.multipart.max-request-size=4MB
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m
server.error.include-message=never
server.error.include-stacktrace=never
spring.jackson.time-zone=Asia/Kolkata
app.demo=${DEMO_DATA:true}
app.uploads=${UPLOAD_DIR:./uploads}
